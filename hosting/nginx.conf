# The directory and every game, as `npm run build` lays them out in dist/. Envoy terminates TLS;
# the pod speaks plain http.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # The build gzips every text file next to itself.
    gzip_static on;
    # A dev host: kept out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    # Hashed file names: a new build is a new name.
    location /assets/ {
        expires max;
    }

    # The pages name the current hashes, so the browser asks every time.
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }
}
